<!doctype html>
<meta charset="utf-8">
<title>Umroh Sakti — pengaturan</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 460px; margin: 40px auto; padding: 0 16px; font: 14px/1.55 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { color: color-mix(in srgb, currentColor 60%, transparent); margin: 0 0 16px; }
  label { display: grid; gap: 4px; font-size: 12px; margin-bottom: 12px;
          color: color-mix(in srgb, currentColor 60%, transparent); }
  input { padding: 7px 9px; font: inherit; color: inherit; background: transparent;
          border: 1px solid #8884; border-radius: 6px; }
  button { padding: 7px 14px; font: inherit; font-weight: 500; cursor: pointer;
           color: canvas; background: canvastext; border: 0; border-radius: 6px; }
  #status { margin-top: 12px; font-size: 12px; }
  #status.gagal { color: #dc2626; }
  #status.oke { color: #16a34a; }
</style>

<h1>Alamat portal</h1>
<p>Portalnya kamu sendiri yang jalankan — extension ini tidak punya server. Isi alamat tempat
   Umroh Sakti dipasang, lalu izinkan aksesnya saat Chrome bertanya.</p>

<form id="simpan">
  <label>Alamat portal
    <input name="portal" type="url" required placeholder="http://localhost:8000">
  </label>
  <button>Simpan</button>
</form>

<p id="status"></p>

<script src="options.js"></script>
